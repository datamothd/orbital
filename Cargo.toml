[package]
name = "orbital"
version = "0.3.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
sysinfo = "0.39.6"
winreg = "0.56.0"
serde = { version = "1", features = ["derive"] }
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell_Common"] }

[profile.dev]
incremental = false
