[package]
name = "orbital-desktop"
version = "0.3.1"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orbital = { path = ".." }
tauri = { version = "2", features = [] }
serde_json = "1"
quick-xml = "0.42"
windows = { version = "0.62", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Imapi", "Win32_Storage_Vhd", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Controls_Dialogs", "Win32_UI_Shell"] }

[profile.dev]
incremental = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
