[package]
name = "orbital-desktop"
version = "0.1.2"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orbital = { path = ".." }
tauri = { version = "2", features = [] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_UI_Controls_Dialogs"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
